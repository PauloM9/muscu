<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Road to Super Sayan 🔥</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&family=Nunito+Sans:wght@400;600;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{
  --bg:#07101A;--bg2:#0C1824;--card:#101E2E;--card2:#152438;--border:#1E3350;
  --ice:#48CAE4;--ice2:#90E0EF;--ice3:#CAF0F8;--blue:#0077B6;--blue2:#0096C7;
  --text:#E8F4FD;--t2:#90CAF9;--t3:#4A7FA5;--t4:#1E3A5F;
  --green:#00F5A0;--red:#FF6B6B;--orange:#FFB347;--yellow:#FFD60A;
  --nav:56px;--topbar:64px;--restbar:0px;
  --radius:18px;--radius-sm:12px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html{height:100%;overflow:hidden}
body{
  height:100%;overflow:hidden;
  background:var(--bg);color:var(--text);
  font-family:'Nunito',sans-serif;
  display:flex;flex-direction:column;
  position:relative;
}
/* GOKU BACKGROUND */
.goku-bg{
  position:fixed;right:-30px;bottom:50px;width:260px;height:380px;
  z-index:0;pointer-events:none;opacity:.07;
  background:radial-gradient(ellipse at center,rgba(72,202,228,.3) 0%,transparent 70%);
}
.goku-bg svg{width:100%;height:100%}
body::before{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse 60% 40% at 80% 15%,rgba(72,202,228,.07) 0%,transparent 100%),
    radial-gradient(ellipse 50% 60% at 20% 85%,rgba(0,119,182,.09) 0%,transparent 100%);
}

/* ── NAV ── */
nav{
  height:var(--nav);flex-shrink:0;position:relative;z-index:60;
  background:rgba(7,16,26,.96);backdrop-filter:blur(24px);
  border-bottom:1px solid rgba(72,202,228,.1);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 1rem;
}
.logo{
  font-family:'Nunito',sans-serif;font-weight:900;font-size:1.05rem;
  color:var(--text);letter-spacing:.3px;display:flex;align-items:center;gap:.3rem;
  white-space:nowrap;
}
.logo .flame{font-size:1.1rem}
.nav-tabs{display:flex;gap:.2rem}
.ntb{
  background:none;border:none;color:var(--t3);font-family:'Nunito';
  font-size:.7rem;font-weight:700;padding:.4rem .65rem;border-radius:10px;
  cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:.1rem;
  transition:all .18s;letter-spacing:.2px;
}
.ntb svg,.ntb .ico{font-size:.95rem;line-height:1}
.ntb:active{transform:scale(.93)}
.ntb.act{color:var(--ice);background:rgba(72,202,228,.1);box-shadow:inset 0 0 0 1px rgba(72,202,228,.2)}

/* ── APP SCROLL ── */
#app{flex:1;overflow:hidden;position:relative;z-index:1}
.section{display:none;height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;scroll-behavior:smooth}
.section::-webkit-scrollbar{display:none}
.section.act{display:block}
.inner{padding:.9rem .9rem calc(var(--restbar) + 4rem)}

/* ── BUTTONS ── */
.btn{
  border:none;border-radius:14px;font-family:'Nunito';font-weight:800;
  cursor:pointer;display:inline-flex;align-items:center;justify-content:center;
  gap:.35rem;transition:all .15s;letter-spacing:.2px;-webkit-tap-highlight-color:transparent;
}
.btn:active{transform:scale(.95)}
.btn-ice{background:linear-gradient(135deg,var(--blue2),var(--ice));color:#fff;padding:.7rem 1.4rem;font-size:.9rem;box-shadow:0 4px 20px rgba(72,202,228,.25)}
.btn-ghost{background:rgba(72,202,228,.08);color:var(--ice2);padding:.62rem 1.1rem;font-size:.85rem;border:1px solid rgba(72,202,228,.18)}
.btn-danger{background:rgba(255,107,107,.1);color:var(--red);padding:.55rem 1rem;font-size:.83rem;border:1px solid rgba(255,107,107,.2)}
.btn-sm{padding:.38rem .75rem;font-size:.78rem;border-radius:10px}
.btn-xs{padding:.28rem .55rem;font-size:.72rem;border-radius:8px}
.btn-round{width:36px;height:36px;border-radius:50%;padding:0;font-size:.95rem}
.btn-icon{background:none;border:none;cursor:pointer;color:var(--t3);font-size:1rem;padding:.32rem;border-radius:8px;transition:color .15s;font-family:'Nunito'}
.btn-icon:active{color:var(--ice)}

/* ── CARDS ── */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:1rem}
.card-glow{border-color:rgba(72,202,228,.22);box-shadow:0 0 20px rgba(72,202,228,.08)}

/* ── INPUTS ── */
input,select,textarea{
  background:rgba(12,24,36,.9);border:1px solid var(--border);color:var(--text);
  font-family:'Nunito';border-radius:10px;padding:.58rem .85rem;font-size:.92rem;
  outline:none;transition:border-color .2s,box-shadow .2s;width:100%;font-weight:600;
}
input:focus,select:focus{border-color:var(--ice);box-shadow:0 0 0 2px rgba(72,202,228,.12)}
input[type=number]{-moz-appearance:textfield;text-align:center;font-weight:700}
input[type=number]::-webkit-inner-spin-button{display:none}
select option{background:var(--card2)}

/* ── TAGS ── */
.tag{display:inline-flex;align-items:center;padding:.18rem .58rem;border-radius:20px;font-size:.68rem;font-weight:700;letter-spacing:.2px}
.t-ice{background:rgba(72,202,228,.12);color:var(--ice2);border:1px solid rgba(72,202,228,.2)}
.t-blue{background:rgba(0,150,199,.12);color:#64B5F6;border:1px solid rgba(0,150,199,.2)}
.t-green{background:rgba(0,245,160,.1);color:var(--green);border:1px solid rgba(0,245,160,.18)}
.t-orange{background:rgba(255,179,71,.1);color:var(--orange);border:1px solid rgba(255,179,71,.18)}
.t-red{background:rgba(255,107,107,.1);color:var(--red);border:1px solid rgba(255,107,107,.18)}

/* ── STATS ── */
.stats-row{display:grid;grid-template-columns:repeat(2,1fr);gap:.6rem;margin-bottom:.9rem}
.stats-row.three{grid-template-columns:repeat(3,1fr)}
.stat-box{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:.75rem .6rem;text-align:center;position:relative;overflow:hidden}
.stat-box::after{content:'';position:absolute;top:0;inset-x:0;height:2px;background:linear-gradient(90deg,transparent,var(--ice),transparent);opacity:.3}
.stat-v{font-family:'Nunito',sans-serif;font-size:1.6rem;font-weight:900;color:var(--ice);font-variant-numeric:tabular-nums;line-height:1;text-shadow:0 0 16px rgba(72,202,228,.3)}
.stat-l{font-size:.62rem;color:var(--t3);text-transform:uppercase;letter-spacing:.8px;margin-top:.2rem;font-weight:700}

/* ── SECTION TITLE ── */
.sec-title{font-family:'Nunito',sans-serif;font-size:1.25rem;font-weight:900;color:var(--ice3);letter-spacing:.2px}
.sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:.9rem;gap:.5rem}

/* ── ROUTINE CARD ── */
.r-card{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:.9rem 1rem;margin-bottom:.55rem;
  display:flex;align-items:center;gap:.7rem;
  position:relative;overflow:hidden;transition:border-color .2s,transform .15s;
}
.r-card:active{transform:scale(.98)}
.r-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,var(--ice),var(--blue2));opacity:0;transition:opacity .2s}
.r-card:hover::before,.r-card:active::before{opacity:1}
.r-name{font-weight:800;font-size:.97rem;margin-bottom:.2rem}
.r-meta{font-size:.72rem;color:var(--t3);font-weight:600}

/* ── WORKOUT TOPBAR ── */
.topbar{
  height:var(--topbar);flex-shrink:0;
  background:rgba(7,16,26,.97);backdrop-filter:blur(20px);
  border-bottom:1px solid rgba(72,202,228,.1);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 .9rem;gap:.5rem;
}
.timer-big{font-family:'Nunito',sans-serif;font-size:1.9rem;font-weight:900;font-variant-numeric:tabular-nums;color:var(--ice);text-shadow:0 0 20px rgba(72,202,228,.35);letter-spacing:1px;line-height:1}

/* ── EXO BLOCK ── */
.exo-block{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);margin-bottom:.65rem;overflow:hidden;
}
.exo-head{display:flex;align-items:center;padding:.75rem .9rem;gap:.65rem}
.exo-icon{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.35rem;flex-shrink:0}
.exo-nm{font-weight:800;font-size:.92rem;line-height:1.2}
.exo-sub{font-size:.68rem;color:var(--t3);margin-top:.2rem;font-weight:600}
.exo-ctrl{display:flex;align-items:center;gap:.3rem;margin-left:auto;flex-shrink:0}
.exo-body{padding:0 .75rem .75rem}
.exo-body.collapsed{display:none}

/* ── SETS TABLE ── */
.stbl{width:100%;border-collapse:collapse}
.stbl th{font-size:.63rem;color:var(--t4);text-align:center;padding:.35rem .15rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border)}
.stbl th:first-child{text-align:left;padding-left:.3rem}
.stbl td{padding:.28rem .1rem;vertical-align:middle;text-align:center}
.set-done td{background:rgba(0,245,160,.04)}
.s-num{font-size:.72rem;color:var(--t3);font-weight:800;min-width:18px;text-align:left;padding-left:.3rem}
.sinp{width:56px!important;text-align:center;font-weight:800;font-size:.88rem;padding:.28rem .1rem!important;border-radius:8px!important}
.bw-tag{font-size:.63rem;color:var(--ice);background:rgba(72,202,228,.1);border-radius:5px;padding:.12rem .4rem;font-weight:700}
.del-set{width:24px;height:24px;border-radius:6px;border:none;background:rgba(255,107,107,.1);color:var(--red);cursor:pointer;font-size:.75rem;display:flex;align-items:center;justify-content:center;margin:0 auto;transition:all .15s}
.del-set:active{background:rgba(255,107,107,.25);transform:scale(.9)}
.chk{width:30px;height:30px;border-radius:8px;border:2px solid var(--border);background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.9rem;transition:all .18s;color:transparent;margin:0 auto}
.chk:active{transform:scale(.88)}
.chk.done{background:var(--green);border-color:var(--green);color:#000;box-shadow:0 0 12px rgba(0,245,160,.35)}

/* ── REST BAR ── */
.rest-bar{
  position:fixed;bottom:var(--nav);left:0;right:0;z-index:90;
  background:rgba(7,16,26,.98);backdrop-filter:blur(24px);
  border-top:1px solid rgba(72,202,228,.25);
  padding:.6rem .9rem;display:none;align-items:center;justify-content:space-between;
  gap:.7rem;box-shadow:0 -6px 30px rgba(72,202,228,.1);
}
.rest-bar.on{display:flex}
.rest-ring{position:relative;width:46px;height:46px;flex-shrink:0}
.rest-ring svg{transform:rotate(-90deg)}
.ring-n{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Nunito',sans-serif;font-size:.85rem;font-weight:900;color:var(--ice);font-variant-numeric:tabular-nums}
.rest-t{font-family:'Nunito',sans-serif;font-size:1.4rem;font-weight:900;color:var(--ice);font-variant-numeric:tabular-nums;line-height:1}
.rest-lbl{font-size:.65rem;color:var(--t3);font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.rest-btns{display:flex;gap:.35rem;align-items:center}

/* ── MODAL ── */
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(8px)}
.modal-ov.center{align-items:center;padding:.9rem}
.modal{background:var(--card);border:1px solid rgba(72,202,228,.1);border-radius:22px 22px 0 0;padding:1.2rem .9rem 1.6rem;width:100%;max-width:500px;max-height:92vh;overflow-y:auto}
.modal.rd{border-radius:22px}
.modal::-webkit-scrollbar{display:none}
.m-handle{width:38px;height:4px;background:var(--border);border-radius:2px;margin:0 auto .9rem}
.m-title{font-family:'Nunito',sans-serif;font-size:1.1rem;font-weight:900;color:var(--ice3);margin-bottom:1rem;letter-spacing:.2px}
.form-g{margin-bottom:.8rem}
.form-g label{font-size:.7rem;color:var(--t3);font-weight:700;display:block;margin-bottom:.3rem;text-transform:uppercase;letter-spacing:.4px}

/* ── EXO PICKER ── */
.ep-item{
  display:flex;align-items:center;gap:.7rem;padding:.6rem .65rem;
  background:rgba(12,24,36,.8);border-radius:12px;cursor:pointer;
  transition:all .15s;border:1px solid transparent;margin-bottom:.38rem;
}
.ep-item:active{background:rgba(72,202,228,.07);border-color:rgba(72,202,228,.2);transform:scale(.98)}
.ep-icon{width:48px;height:48px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.4rem;flex-shrink:0}
.ep-name{font-weight:700;font-size:.87rem;line-height:1.3}
.ep-desc{font-size:.65rem;color:var(--t3);margin-top:.18rem;line-height:1.4;font-weight:600}

/* ── HISTORY ── */
.h-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:.9rem 1rem;margin-bottom:.55rem;cursor:pointer;transition:all .18s;position:relative;padding-left:1.2rem}
.h-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,var(--ice),var(--blue2));border-radius:2px}
.h-card:active{transform:scale(.98)}
.h-stats{display:flex;gap:.9rem;margin-top:.45rem;flex-wrap:wrap}
.h-v{font-weight:800;font-size:.9rem;font-variant-numeric:tabular-nums}
.h-l{font-size:.63rem;color:var(--t3);font-weight:700;display:block;margin-top:.05rem}

/* ── CHARTS ── */
.chart-tabs{display:flex;gap:.3rem;margin-bottom:.75rem;background:rgba(12,24,36,.7);border-radius:12px;padding:.3rem}
.ct{flex:1;background:none;border:none;color:var(--t3);font-family:'Nunito';font-size:.73rem;font-weight:700;padding:.38rem;border-radius:9px;cursor:pointer;transition:all .18s;text-transform:uppercase;letter-spacing:.3px}
.ct.act{background:rgba(72,202,228,.14);color:var(--ice);border:1px solid rgba(72,202,228,.2)}
.chart-box{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:.85rem;margin-bottom:.65rem}
.chart-ttl{font-size:.68rem;color:var(--t3);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:.6rem}

/* ── EMOJI ── */
.emoji-row{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.5rem;padding:.5rem;background:rgba(12,24,36,.7);border-radius:12px}
.em-btn{font-size:1.25rem;background:none;border:1px solid var(--border);border-radius:9px;padding:.3rem .35rem;cursor:pointer;transition:all .12s}
.em-btn:active{transform:scale(1.2);border-color:var(--ice)}

/* ── COMPARE ── */
.cmp-row{display:flex;align-items:center;justify-content:space-between;padding:.42rem 0;border-bottom:1px solid rgba(255,255,255,.04);font-size:.83rem}
.up{color:var(--green)}.dn{color:var(--red)}.eq{color:var(--t3)}

/* ── CHIP FILTER ── */
.chip-scroll{display:flex;gap:.3rem;overflow-x:auto;padding-bottom:.3rem;margin-bottom:.65rem;-webkit-overflow-scrolling:touch}
.chip-scroll::-webkit-scrollbar{display:none}
.chip{padding:.32rem .75rem;border-radius:20px;font-size:.73rem;font-weight:700;border:1px solid var(--border);background:rgba(12,24,36,.8);color:var(--t3);cursor:pointer;white-space:nowrap;transition:all .15s;flex-shrink:0}
.chip.on{background:rgba(72,202,228,.14);border-color:rgba(72,202,228,.25);color:var(--ice)}

/* ── REST SELECT ── */
.rest-sel{width:72px!important;padding:.28rem .3rem!important;font-size:.75rem!important;border-radius:8px!important;text-align:center}

/* ── LIVE ── */
.live{display:inline-flex;align-items:center;gap:.3rem;font-size:.68rem;color:var(--green);font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.ldot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}

/* ── EMPTY ── */
.empty{text-align:center;padding:3rem 1rem;color:var(--t3)}
.empty-ico{font-size:2.5rem;margin-bottom:.6rem;opacity:.35}

/* ── ANIM ── */
@keyframes slideUp{from{transform:translateY(14px);opacity:0}to{transform:translateY(0);opacity:1}}
.su{animation:slideUp .2s ease}

/* ── MISC ── */
hr{border:none;border-top:1px solid var(--border);margin:.75rem 0}
</style>
</head>
<body>

</div>

<nav>
  <div class="logo">Road to Super Sayan <span class="flame">🔥</span></div>
  <div class="nav-tabs">
    <button class="ntb act" data-tab="workout"><div class="ico">🏋️</div>Séance</button>
    <button class="ntb" data-tab="routines"><div class="ico">📋</div>Routines</button>
    <button class="ntb" data-tab="history"><div class="ico">📊</div>Stats</button>
  </div>
</nav>

<div id="app">
<!-- WORKOUT -->
<div id="tab-workout" class="section act">
  <div id="v-home">
    <div class="inner">
      <div class="sec-head"><div class="sec-title">Bonne séance 💪</div></div>
      <div id="home-stats"></div>

function exo(id){return EX.find(e=>e.id===id)||{n:id,ic:'💪',m:'',e:'',bw:false,c:'#0077B6',d:''};}

// helpers
function fDur(ms){if(!ms)return'0:00';const s=Math.floor(ms/1000),m=Math.floor(s/60),h=Math.floor(m/60);return h?`${h}h${String(m%60).padStart(2,'0')}m`:`${String(m).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;}
function fRest(s){return`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;}
function fDate(ts){return new Date(ts).toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'});}
function fDateS(ts){return new Date(ts).toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'});}
function fKg(v){return v>=1000?(v/1000).toFixed(1)+'t':Math.round(v)+'kg';}
function vol(w){return(w.exercises||[]).reduce((a,ex)=>a+ex.sets.filter(s=>s.done).reduce((b,s)=>b+(ex.bw?0:(s.weight||0)*(s.reps||0)),0),0);}
function reps(w){return(w.exercises||[]).reduce((a,ex)=>a+ex.sets.filter(s=>s.done).reduce((b,s)=>b+(s.reps||0),0),0);}
function sets(w){return(w.exercises||[]).reduce((a,ex)=>a+ex.sets.filter(s=>s.done).length,0);}
function lastPR(id){for(let i=S.sessions.length-1;i>=0;i--){const ex=(S.sessions[i].exercises||[]).find(e=>e.id===id);if(ex){const d=ex.sets.filter(s=>s.done);if(d.length){const s=d[d.length-1];return ex.bw?`↩ ${d.length}×${s.reps}rep`:d.length?`↩ ${d.length}×${s.reps}rep @ ${s.weight}kg`:null;}}}return null;}

function renderHome(){
  if(S.cw){showActive();return;}
  ge('v-home').style.display='block';ge('v-active').style.display='none';
  // stats
  const hs=ge('home-stats');
  if(S.sessions.length){
    const ls=S.sessions[S.sessions.length-1];
    hs.innerHTML=`<div class="stats-row three" style="margin-bottom:.9rem">
      <div class="stat-box"><div class="stat-v">${S.sessions.length}</div><div class="stat-l">Séances</div></div>
      <div class="stat-box"><div class="stat-v">${fKg(S.sessions.reduce((a,s)=>a+(s.volume||0),0))}</div><div class="stat-l">Volume</div></div>
      <div class="stat-box"><div class="stat-v">${fDur(ls.duration||0)}</div><div class="stat-l">Dernière</div></div>
    </div>`;
  } else hs.innerHTML='';
  // routines
  const hr=ge('home-routines');
  if(!S.routines.length){hr.innerHTML=`<div style="background:var(--card);border:1px dashed var(--border);border-radius:var(--radius);padding:1.2rem;text-align:center;color:var(--t3);font-size:.85rem;font-weight:600;margin-bottom:.5rem">Crée une routine dans l'onglet Routines 💡</div>`;return;}
  hr.innerHTML=S.routines.map((r,i)=>`
    <div class="r-card">
      <div style="flex:1;min-width:0">
        <div class="r-name">${r.name}</div>
        <div class="r-meta">${r.exercises.length} ex · ${[...new Set(r.exercises.map(e=>e.m))].slice(0,2).join(', ')}</div>
      </div>
      <button class="btn btn-ice btn-sm" onclick="startRoutine(${i})">▶ Start</button>
    </div>`).join('');
}

// ── WORKOUT ──
function startRoutine(i){
  const r=S.routines[i];
  S.cw={name:r.name,rIdx:i,start:Date.now(),notes:'',
    exercises:r.exercises.map(e=>({...e,sets:Array.from({length:e.dSets||3},()=>({reps:e.dReps||10,weight:e.dW||0,done:false}))}))};
  save();startWTimer();showActive();
}
function startFree(){
  S.cw={name:'Séance libre',rIdx:null,start:Date.now(),notes:'',exercises:[]};
  save();startWTimer();showActive();
}
function showActive(){
  ge('v-home').style.display='none';ge('v-active').style.display='block';
  ge('w-name').textContent=S.cw.name;
  renderActive();
}
function startWTimer(){
  wStart=S.cw.start;clearInterval(wInt);
  wInt=setInterval(()=>{const e=ge('w-timer');if(e)e.textContent=fDur(Date.now()-wStart);},1000);
}

function renderActive(){
  const c=ge('active-exos');c.innerHTML='';
  S.cw.exercises.forEach((ex,ei)=>c.appendChild(buildExoBlock(ex,ei)));
}

function buildExoBlock(ex,ei){
  const def=exo(ex.id);const pr=lastPR(ex.id);
  const div=document.createElement('div');div.className='exo-block su';
  const rv=ex.restTime||60;
  const restOptions=[30,45,60,75,90,105,120,135,150,180,210,240,270,300].map(v=>`<option value="${v}"${rv===v?' selected':''}>${fRest(v)}</option>`).join('');
  const isCollapsed=ex._collapsed;
  div.innerHTML=`
    <div class="exo-head">
      <div class="exo-icon" style="background:${def.c}18;border:1px solid ${def.c}30">${def.ic}</div>
      <div style="flex:1;min-width:0">
        <div class="exo-nm">${def.n}</div>
        <div class="exo-sub">
          <span class="tag t-blue">${def.m}</span>
          <span class="tag ${ex.bw?'t-ice':'t-orange'}" style="margin-left:.2rem">${ex.bw?'Poids corps':def.e}</span>
        </div>
      </div>
      <div class="exo-ctrl">
        <select class="rest-sel" data-ei="${ei}">${restOptions}</select>
        <button class="btn-icon" onclick="toggleExo(${ei})" style="font-size:.9rem">${isCollapsed?'➕':'➖'}</button>
        <button class="btn-icon" onclick="rmExo(${ei})">✕</button>
      </div>
    </div>
    ${pr?`<div style="padding:0 .9rem .4rem;font-size:.68rem;color:var(--t3);font-weight:700">${pr}</div>`:''}
    <div class="exo-body${isCollapsed?' collapsed':''}" id="body-${ei}">
      <table class="stbl">
        <thead><tr><th>#</th><th>Reps</th><th>${ex.bw?'BW':'Poids kg'}</th><th>Vol</th><th>✕</th><th>✓</th></tr></thead>
        <tbody id="sets-${ei}"></tbody>
      </table>
      <button class="btn btn-ghost btn-xs" style="margin-top:.5rem" onclick="addSet(${ei})">+ Série</button>
    </div>`;
  div.querySelector('.rest-sel').addEventListener('change',function(){S.cw.exercises[ei].restTime=+this.value;save();});
  renderSets(ei);
  return div;
}

function toggleExo(ei){
  const ex=S.cw.exercises[ei];ex._collapsed=!ex._collapsed;save();
  const body=ge('body-'+ei);
  if(body)body.classList.toggle('collapsed',ex._collapsed);
  const btn=document.querySelectorAll('.exo-ctrl')[ei]?.querySelector('.btn-icon');
  // re-render is simpler
  renderActive();
}

function renderSets(ei){
  const ex=S.cw.exercises[ei];
  const tbody=ge('sets-'+ei);if(!tbody)return;
  tbody.innerHTML='';
  ex.sets.forEach((s,si)=>{
    const v=ex.bw?'BW':((s.reps||0)*(s.weight||0)).toFixed(0)+'kg';
    const tr=document.createElement('tr');tr.className=s.done?'set-done':'';
    tr.innerHTML=`
      <td><span class="s-num">${si+1}</span></td>
      <td><input type="number" class="sinp" value="${s.reps||''}" placeholder="10" min="1" onchange="updS(${ei},${si},'reps',this.value)"></td>
      <td>${ex.bw?`<span class="bw-tag">BW</span>`:`<input type="number" class="sinp" value="${s.weight||''}" placeholder="0" min="0" step="0.5" onchange="updS(${ei},${si},'weight',this.value)">`}</td>
      <td style="font-size:.72rem;color:var(--t3);font-weight:700;font-variant-numeric:tabular-nums">${v}</td>
      <td><button class="del-set" onclick="delSet(${ei},${si})">✕</button></td>
      <td><button class="chk${s.done?' done':''}" onclick="togSet(${ei},${si})">${s.done?'✓':''}</button></td>`;
    tbody.appendChild(tr);
  });
}
function updS(ei,si,f,v){const ex=S.cw.exercises[ei];ex.sets[si][f]=f==='reps'?parseInt(v)||0:parseFloat(v)||0;save();renderSets(ei);}
function delSet(ei,si){S.cw.exercises[ei].sets.splice(si,1);save();renderSets(ei);}
function addSet(ei){const ex=S.cw.exercises[ei];const l=ex.sets[ex.sets.length-1]||{reps:10,weight:0};ex.sets.push({reps:l.reps,weight:l.weight,done:false});save();renderSets(ei);}
function togSet(ei,si){const ex=S.cw.exercises[ei];ex.sets[si].done=!ex.sets[si].done;save();renderSets(ei);if(ex.sets[si].done)startRest(ex.restTime||60);}
function rmExo(ei){S.cw.exercises.splice(ei,1);save();renderActive();}
function addExoActive(){openExoPicker(e=>{S.cw.exercises.push({...e,restTime:60,sets:[{reps:10,weight:0,done:false},{reps:10,weight:0,done:false},{reps:10,weight:0,done:false}]});save();renderActive();setTimeout(()=>ge('tab-workout').scrollTo(0,99999),120);});}

// ── REST TIMER ──
function startRest(s){
  clearInterval(rInt);rTotal=s;rLeft=s;
  ge('rest-bar').classList.add('on');
  document.body.style.setProperty('--restbar','60px');
  updRest();
  rInt=setInterval(()=>{rLeft--;updRest();if(rLeft<=0){clearInterval(rInt);skipRest();}},1000);
}
function updRest(){
  ge('r-t').textContent=fRest(Math.max(0,rLeft));
  ge('r-n').textContent=Math.max(0,rLeft);
  const arc=ge('r-arc');
  if(arc)arc.style.strokeDashoffset=(119*(1-Math.max(0,rLeft)/rTotal)).toFixed(1);
}
function skipRest(){clearInterval(rInt);ge('rest-bar').classList.remove('on');document.body.style.setProperty('--restbar','0px');}
function chRest(d){rLeft=Math.max(5,rLeft+d);if(rLeft>rTotal)rTotal=rLeft;updRest();}

// ── FINISH ──
function endWorkout(){
  clearInterval(wInt);
  const w=S.cw;w.duration=Date.now()-w.start;w.volume=vol(w);w.totalSets=sets(w);w.totalReps=reps(w);
  ge('fin-stats').innerHTML=`
    <div class="stat-box"><div class="stat-v">${fDur(w.duration)}</div><div class="stat-l">Durée</div></div>
    <div class="stat-box"><div class="stat-v">${w.totalSets}</div><div class="stat-l">Séries</div></div>
    <div class="stat-box"><div class="stat-v">${fKg(w.volume)}</div><div class="stat-l">Volume</div></div>
    <div class="stat-box"><div class="stat-v">${w.exercises.length}</div><div class="stat-l">Exercices</div></div>`;
  ge('m-finish').style.display='flex';
}
function saveWO(){
  const w=S.cw;w.notes=ge('inp-note').value;w.savedAt=Date.now();
  S.sessions.push({...w});S.cw=null;save();
  ge('m-finish').style.display='none';skipRest();
  ge('v-active').style.display='none';ge('v-home').style.display='block';renderHome();
}
function discardWO(){
  if(!confirm('Abandonner sans enregistrer ?'))return;
  S.cw=null;clearInterval(wInt);save();skipRest();
  ge('m-finish').style.display='none';ge('v-active').style.display='none';ge('v-home').style.display='block';renderHome();
}

// ── ROUTINES ──
function renderRoutines(){
  const c=ge('routines-list');
  if(!S.routines.length){c.innerHTML=`<div class="empty"><div class="empty-ico">📋</div><p style="font-weight:700">Aucune routine</p><button class="btn btn-ice" style="margin-top:.8rem" onclick="openRModal()">+ Créer</button></div>`;return;}
  c.innerHTML=S.routines.map((r,i)=>`
    <div class="r-card">
      <div style="flex:1;min-width:0">
        <div class="r-name">${r.name}</div>
        <div class="r-meta">${r.exercises.length} exercice${r.exercises.length!==1?'s':''} · ${[...new Set(r.exercises.map(e=>e.m))].join(', ')}</div>
      </div>
      <div style="display:flex;gap:.35rem;flex-shrink:0">
        <button class="btn-icon" onclick="editR(${i})">✏️</button>
        <button class="btn-icon" onclick="delR(${i})">🗑️</button>
        <button class="btn btn-ice btn-xs" onclick="startRoutine(${i});document.querySelector('[data-tab=workout]').click()">▶</button>
      </div>
    </div>`).join('');
}
function openRModal(idx=null){
  rEditIdx=idx;tmpExos=[];
  ge('rm-title').textContent=idx!==null?'Modifier la routine':'Nouvelle routine';
  if(idx!==null){const r=S.routines[idx];ge('inp-rname').value=r.name;tmpExos=r.exercises.map(e=>({...e}));}
  else ge('inp-rname').value='';
  renderMExos();ge('m-routine').style.display='flex';
}
function editR(i){openRModal(i);}
function closeRModal(){ge('m-routine').style.display='none';ge('emoji-panel').style.display='none';}
function delR(i){if(confirm('Supprimer ?')){S.routines.splice(i,1);save();renderRoutines();}}
function renderMExos(){
  const c=ge('m-exo-list');
  if(!tmpExos.length){c.innerHTML='<div style="color:var(--t3);font-size:.8rem;font-weight:600;padding:.3rem 0">Aucun exercice</div>';return;}
  c.innerHTML=tmpExos.map((e,i)=>`
    <div style="display:flex;align-items:center;gap:.5rem;padding:.45rem .6rem;background:rgba(12,24,36,.8);border-radius:10px;margin-bottom:.35rem">
      <span style="font-size:1.05rem;flex-shrink:0">${exo(e.id).ic}</span>
      <div style="flex:1;min-width:0;font-weight:700;font-size:.83rem;overflow:hidden;white-space:nowrap;text-overflow:ellipsis">${e.n}</div>
      <input type="number" value="${e.dSets||3}" min="1" max="20" style="width:36px;padding:.22rem;font-size:.75rem;text-align:center" onchange="tmpExos[${i}].dSets=+this.value" title="Séries">
      <span style="font-size:.7rem;color:var(--t3);font-weight:700">×</span>
      <input type="number" value="${e.dReps||10}" min="1" max="100" style="width:36px;padding:.22rem;font-size:.75rem;text-align:center" onchange="tmpExos[${i}].dReps=+this.value" title="Reps">
      <button class="btn-icon" onclick="tmpExos.splice(${i},1);renderMExos()">✕</button>
    </div>`).join('');
}
function addExoRModal(){openExoPicker(e=>{tmpExos.push({...e,dSets:3,dReps:10,dW:0});renderMExos();});}
function saveRoutine(){
  const name=ge('inp-rname').value.trim();if(!name)return;
  const r={name,exercises:tmpExos};
  if(rEditIdx!==null)S.routines[rEditIdx]=r;else S.routines.push(r);
  save();closeRModal();renderRoutines();
}

// ── EMOJI ──
function toggleEmoji(){
  const p=ge('emoji-panel');
  if(p.style.display==='none'){
    p.style.display='block';
    p.innerHTML=`<div class="emoji-row">${EMOJIS.map(e=>`<button class="em-btn" onclick="insEmoji('${e}')">${e}</button>`).join('')}</div>`;
  } else p.style.display='none';
}
function insEmoji(e){const i=ge('inp-rname');i.value=e+' '+i.value.trim();ge('emoji-panel').style.display='none';i.focus();}

// ── EXO PICKER ──
function openExoPicker(cb){
  exoCb=cb;mFilter='Tous';ge('exo-search').value='';
  const chips=ge('muscle-chips');
  chips.innerHTML=MUSCLES.map(m=>`<div class="chip${m===mFilter?' on':''}" onclick="setMF('${m}',this)">${m}</div>`).join('');
  filterExos();ge('m-exo').style.display='flex';
}
function closeExoModal(){ge('m-exo').style.display='none';}
function setMF(m,el){mFilter=m;document.querySelectorAll('#muscle-chips .chip').forEach(c=>c.classList.remove('on'));el.classList.add('on');filterExos();}
function filterExos(){
  const q=ge('exo-search').value.toLowerCase();
  const list=EX.filter(e=>(mFilter==='Tous'||e.m===mFilter)&&(!q||e.n.toLowerCase().includes(q)||e.m.toLowerCase().includes(q)||e.e.toLowerCase().includes(q)));
  ge('exo-list').innerHTML=list.map(e=>`
    <div class="ep-item" onclick="pickEx('${e.id}')">
      <div class="ep-icon" style="background:${e.c}18;border:1px solid ${e.c}30">${e.ic}</div>
      <div style="flex:1;min-width:0">
        <div class="ep-name">${e.n}</div>
        <div style="display:flex;gap:.25rem;margin:.18rem 0;flex-wrap:wrap">
          <span class="tag t-blue">${e.m}</span>
          <span class="tag ${e.bw?'t-ice':'t-orange'}">${e.bw?'Poids corps':e.e}</span>
        </div>
        <div class="ep-desc">${e.d}</div>
      </div>
    </div>`).join('');
}
function pickEx(id){const e=EX.find(x=>x.id===id);if(!e)return;closeExoModal();if(exoCb)exoCb({...e});}

// ── HISTORY ──
function renderHistory(){
  const c=ge('history-list');
  if(!S.sessions.length){c.innerHTML=`<div class="empty"><div class="empty-ico">📊</div><p style="font-weight:700">Aucune séance</p></div>`;return;}
  c.innerHTML=[...S.sessions].reverse().map((s,ri)=>{
    const i=S.sessions.length-1-ri;
    return`<div class="h-card" onclick="openDet(${i})">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:.3rem">
        <div style="font-weight:800;font-size:.95rem">${s.name}</div>
        <span class="tag t-ice">${s.exercises.length} ex</span>
      </div>
      <div style="font-size:.7rem;color:var(--t3);font-weight:600;margin-bottom:.4rem">${fDate(s.savedAt||s.start)}</div>
      <div class="h-stats">
        <div><span class="h-v">${fDur(s.duration||0)}</span><span class="h-l">Durée</span></div>
        <div><span class="h-v">${s.totalSets||sets(s)}</span><span class="h-l">Séries</span></div>
        <div><span class="h-v">${fKg(s.volume||vol(s))}</span><span class="h-l">Volume</span></div>
        <div><span class="h-v">${s.totalReps||reps(s)}</span><span class="h-l">Reps</span></div>
      </div>
    </div>`;
  }).join('');
}

// ── CHARTS ──
function getCD(p){
  const now=new Date();let labels=[],vd=[],rd=[],dd=[];
  function bucket(n,labelFn,filterFn){for(let i=n-1;i>=0;i--){const d=new Date(now);if(p==='week')d.setDate(d.getDate()-i);else if(p==='month')d.setDate(d.getDate()-i*7);else d.setMonth(d.getMonth()-i);labels.push(labelFn(d));const ss=S.sessions.filter(s=>filterFn(new Date(s.savedAt||s.start),d));vd.push(ss.reduce((a,s)=>a+(s.volume||vol(s)),0));rd.push(ss.reduce((a,s)=>a+(s.totalReps||reps(s)),0));dd.push(ss.reduce((a,s)=>a+Math.round((s.duration||0)/60000),0));}}
  if(p==='week')bucket(7,d=>d.toLocaleDateString('fr-FR',{weekday:'short'}),(t,d)=>t.toDateString()===d.toDateString());
  else if(p==='month')bucket(5,d=>'S-'+(4-Math.round((now-d)/604800000)),(t,d)=>{const ws=new Date(d);ws.setDate(ws.getDate()-6);return t>=ws&&t<=d;});
  else bucket(12,d=>d.toLocaleDateString('fr-FR',{month:'short'}),(t,d)=>t.getMonth()===d.getMonth()&&t.getFullYear()===d.getFullYear());
  return{labels,vd,rd,dd};
}
const cOpts={responsive:true,maintainAspectRatio:true,plugins:{legend:{display:false}},scales:{x:{grid:{color:'rgba(255,255,255,.04)'},ticks:{color:'#4A7FA5',font:{size:9,family:'Nunito',weight:'700'}}},y:{grid:{color:'rgba(255,255,255,.04)'},ticks:{color:'#4A7FA5',font:{size:9,family:'Nunito',weight:'700'}},beginAtZero:true}}};
function mkChart(id,data,color,type='bar'){
  const cv=ge(id);if(!cv)return;if(charts[id])charts[id].destroy();
  charts[id]=new Chart(cv,{type,data:{labels:data.labels,datasets:[{data:data.d,backgroundColor:color+'28',borderColor:color,borderWidth:2,borderRadius:5,fill:type==='line',tension:.4,pointBackgroundColor:color,pointRadius:2}]},options:{...cOpts}});
}
function renderCharts(){
  const d=getCD(chartP);
  mkChart('c-vol',{labels:d.labels,d:d.vd},'#48CAE4');
  mkChart('c-reps',{labels:d.labels,d:d.rd},'#00F5A0','line');
  mkChart('c-dur',{labels:d.labels,d:d.dd},'#FFB347','line');
}

// ── DETAIL ──
function openDet(i){
  const s=S.sessions[i];
  ge('det-title').textContent=s.name+' — '+fDate(s.savedAt||s.start);
  let prev=null;for(let j=i-1;j>=0;j--){if(S.sessions[j].name===s.name){prev=S.sessions[j];break;}}
  const sv=s.volume||vol(s),ss=s.totalSets||sets(s);
  let h=`<div class="stats-row three" style="margin-bottom:.8rem">
    <div class="stat-box"><div class="stat-v">${fDur(s.duration||0)}</div><div class="stat-l">Durée</div></div>
    <div class="stat-box"><div class="stat-v">${ss}</div><div class="stat-l">Séries</div></div>
    <div class="stat-box"><div class="stat-v">${fKg(sv)}</div><div class="stat-l">Volume</div></div>
  </div>`;
  if(prev){
    const dv=sv-(prev.volume||0),ds=ss-(prev.totalSets||sets(prev));
    h+=`<div style="font-size:.68rem;color:var(--t3);font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-bottom:.4rem">vs session précédente</div>
    <div class="card" style="margin-bottom:.8rem">
      <div class="cmp-row"><span>Volume</span><span class="${dv>0?'up':dv<0?'dn':'eq'}">${dv>0?'+':''}${fKg(Math.abs(dv))} ${dv>0?'▲':dv<0?'▼':'='}</span></div>
      <div class="cmp-row" style="border:none"><span>Séries</span><span class="${ds>0?'up':ds<0?'dn':'eq'}">${ds>0?'+':''}${ds} ${ds>0?'▲':ds<0?'▼':'='}</span></div>
    </div>`;
  }
  h+=`<div style="font-size:.68rem;color:var(--t3);font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-bottom:.4rem">Exercices</div>`;
  s.exercises.forEach(ex=>{
    const d=ex.sets.filter(s=>s.done);if(!d.length)return;
    const def=exo(ex.id);
    h+=`<div style="background:rgba(12,24,36,.8);border-radius:12px;padding:.7rem .8rem;margin-bottom:.45rem;border:1px solid var(--border)">
      <div style="font-weight:800;font-size:.88rem;margin-bottom:.35rem">${def.ic} ${def.n}</div>
      ${d.map((s,i)=>`<div style="font-size:.8rem;color:var(--t2);display:flex;gap:.9rem;padding:.18rem 0;font-weight:600">
        <span style="color:var(--t3);min-width:16px;font-weight:800">${i+1}</span>
        <span>${s.reps} reps</span>
        ${!ex.bw?`<span style="color:var(--ice);font-weight:800">${s.weight}kg</span><span style="color:var(--t3)">${((s.reps||0)*(s.weight||0)).toFixed(0)}kg</span>`:'<span class="bw-tag">BW</span>'}
      </div>`).join('')}
    </div>`;
  });
  if(s.notes)h+=`<div style="background:rgba(12,24,36,.8);border-radius:12px;padding:.65rem .8rem;font-size:.83rem;color:var(--t2);border:1px solid var(--border);font-weight:600">💬 ${s.notes}</div>`;
  ge('det-body').innerHTML=h;ge('m-detail').style.display='flex';
}
function closeDet(){ge('m-detail').style.display='none';}

// ── INIT ──
load();renderHome();
if(S.cw){wStart=S.cw.start;wInt=setInterval(()=>{const e=ge('w-timer');if(e)e.textContent=fDur(Date.now()-wStart);},1000);}
// Migration from old key
try{const old=localStorage.getItem('rtss_v2');if(old&&!S.sessions.length){const o=JSON.parse(old);if(o.sessions)S.sessions=o.sessions;if(o.routines&&!S.routines.length)S.routines=o.routines;save();}}catch(e){}
</script>
