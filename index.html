<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Road to Super Sayan 🔥</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{
  --bg:#07101A;--bg2:#0C1824;--card:#101E2E;--card2:#152438;--border:#1E3350;
  --ice:#48CAE4;--ice2:#90E0EF;--blue:#0077B6;--blue2:#0096C7;
  --text:#E8F4FD;--t2:#90CAF9;--t3:#4A7FA5;--t4:#1E3A5F;
  --green:#00F5A0;--red:#FF6B6B;--orange:#FFB347;--gold:#FFD700;
  --nav:56px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{touch-action:manipulation;font-family:'Nunito',sans-serif}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:'Nunito',sans-serif;display:flex;flex-direction:column;position:relative}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse 60% 40% at 80% 15%,rgba(72,202,228,.06) 0%,transparent 100%),
    radial-gradient(ellipse 50% 60% at 20% 85%,rgba(0,119,182,.08) 0%,transparent 100%);}
.goku-bg{position:fixed;right:-20px;bottom:60px;width:220px;height:340px;z-index:0;pointer-events:none;opacity:.06}
.goku-bg svg{width:100%;height:100%}

/* NAV */
nav{height:var(--nav);flex-shrink:0;position:relative;z-index:60;
  background:rgba(7,16,26,.97);backdrop-filter:blur(24px);
  border-bottom:1px solid rgba(72,202,228,.1);
  display:flex;align-items:center;justify-content:space-between;padding:0 1rem}
.logo{font-weight:900;font-size:1rem;color:var(--text);white-space:nowrap;letter-spacing:.2px}
.nav-tabs{display:flex;gap:.15rem}
.ntb{background:none;border:none;color:var(--t3);font-size:.68rem;font-weight:700;
  padding:.38rem .6rem;border-radius:10px;cursor:pointer;display:flex;flex-direction:column;
  align-items:center;gap:.1rem;transition:all .18s;text-transform:uppercase;letter-spacing:.2px}
.ntb .ico{font-size:.95rem;line-height:1}
.ntb.act{color:var(--ice);background:rgba(72,202,228,.1);box-shadow:inset 0 0 0 1px rgba(72,202,228,.2)}

/* SCROLL */
#app{flex:1;overflow:hidden;position:relative;z-index:1}
.section{display:none;height:100%;overflow-y:scroll;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.section::-webkit-scrollbar{display:none}
.section.act{display:block!important}
.inner{padding:.8rem .85rem 5rem}

/* BUTTONS */
.btn{border:none;border-radius:13px;font-family:'Nunito';font-weight:800;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:.35rem;transition:all .15s}
.btn:active{opacity:.8;transform:scale(.96)}
.btn-ice{background:linear-gradient(135deg,var(--blue2),var(--ice));color:#fff;padding:.65rem 1.3rem;font-size:.88rem}
.btn-ghost{background:rgba(72,202,228,.08);color:var(--ice2);padding:.6rem 1rem;font-size:.84rem;border:1px solid rgba(72,202,228,.18)}
.btn-danger{background:rgba(255,107,107,.1);color:var(--red);padding:.5rem .9rem;font-size:.82rem;border:1px solid rgba(255,107,107,.2)}
.btn-warning{background:rgba(255,179,71,.1);color:var(--orange);padding:.5rem .9rem;font-size:.82rem;border:1px solid rgba(255,179,71,.2)}
.btn-sm{padding:.35rem .7rem;font-size:.76rem;border-radius:10px}
.btn-xs{padding:.25rem .5rem;font-size:.7rem;border-radius:8px}
.btn-icon{background:none;border:none;cursor:pointer;color:var(--t3);font-size:1rem;padding:.3rem;border-radius:8px;transition:color .15s}
.btn-icon:active{color:var(--ice)}

/* CARDS */
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:.95rem}

/* INPUTS */
input,select,textarea{background:rgba(12,24,36,.9);border:1px solid var(--border);color:var(--text);
  border-radius:10px;padding:.55rem .8rem;font-size:.88rem;outline:none;transition:border-color .2s;width:100%;font-weight:600}
input:focus,select:focus{border-color:var(--ice)}
input[type=number]{-moz-appearance:textfield;text-align:center;font-weight:700}
input[type=number]::-webkit-inner-spin-button{display:none}
select option{background:var(--card2)}

/* TAGS */
.tag{display:inline-flex;align-items:center;padding:.16rem .52rem;border-radius:20px;font-size:.67rem;font-weight:700}
.t-ice{background:rgba(72,202,228,.12);color:var(--ice2);border:1px solid rgba(72,202,228,.2)}
.t-blue{background:rgba(0,150,199,.12);color:#64B5F6;border:1px solid rgba(0,150,199,.2)}
.t-green{background:rgba(0,245,160,.1);color:var(--green);border:1px solid rgba(0,245,160,.18)}
.t-orange{background:rgba(255,179,71,.1);color:var(--orange);border:1px solid rgba(255,179,71,.18)}
.t-gold{background:rgba(255,215,0,.12);color:var(--gold);border:1px solid rgba(255,215,0,.25)}

/* STATS */
.stats-row{display:grid;gap:.55rem;margin-bottom:.85rem}
.s2{grid-template-columns:repeat(2,1fr)}
.s3{grid-template-columns:repeat(3,1fr)}
.s4{grid-template-columns:repeat(4,1fr)}
.stat-box{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:.7rem .5rem;text-align:center;position:relative;overflow:hidden}
.stat-box::after{content:'';position:absolute;top:0;inset-x:0;height:2px;background:linear-gradient(90deg,transparent,var(--ice),transparent);opacity:.3}
.sv{font-size:1.5rem;font-weight:900;color:var(--ice);font-variant-numeric:tabular-nums;line-height:1}
.sl{font-size:.6rem;color:var(--t3);text-transform:uppercase;letter-spacing:.6px;margin-top:.18rem;font-weight:700}

/* SECTION TITLE */
.sec-title{font-size:1.2rem;font-weight:900;color:var(--ice2);letter-spacing:.2px}
.sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:.85rem;gap:.5rem}

/* ROUTINE CARD */
.r-card{background:var(--card);border:1px solid var(--border);border-radius:16px;
  padding:.85rem 1rem;margin-bottom:.5rem;display:flex;align-items:center;gap:.7rem;
  position:relative;overflow:hidden;transition:border-color .2s}
.r-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
  background:linear-gradient(180deg,var(--ice),var(--blue2));opacity:0;transition:opacity .2s}
.r-card:active::before{opacity:1}
.r-name{font-weight:800;font-size:.95rem;margin-bottom:.2rem}
.r-meta{font-size:.7rem;color:var(--t3);font-weight:600}

/* WORKOUT TOPBAR */
.topbar{flex-shrink:0;background:rgba(7,16,26,.97);backdrop-filter:blur(20px);
  border-bottom:1px solid rgba(72,202,228,.1);padding:.6rem .85rem;
  display:flex;align-items:center;justify-content:space-between;gap:.5rem}
.timer-big{font-size:1.8rem;font-weight:900;font-variant-numeric:tabular-nums;
  color:var(--ice);letter-spacing:1px;line-height:1}
.timer-paused{color:var(--orange)!important}

/* EXO BLOCK */
.exo-block{background:var(--card);border:1px solid var(--border);border-radius:14px;margin-bottom:.6rem}
.exo-head{display:flex;align-items:center;padding:.7rem .85rem;gap:.6rem}
.exo-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.25rem;flex-shrink:0}
.exo-nm{font-weight:800;font-size:.9rem;line-height:1.2}
.exo-sub{font-size:.67rem;color:var(--t3);margin-top:.15rem;font-weight:600}
.exo-body{padding:0 .7rem .7rem}

/* SETS TABLE */
.stbl{width:100%;border-collapse:collapse}
.stbl th{font-size:.62rem;color:var(--t4);text-align:center;padding:.32rem .1rem;font-weight:700;
  text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid var(--border)}
.stbl th:first-child{text-align:left;padding-left:.25rem;width:24px}
.stbl td{padding:.26rem .08rem;vertical-align:middle;text-align:center}
.set-done td{background:rgba(0,245,160,.04)}
.s-num{font-size:.7rem;color:var(--t3);font-weight:800}
.sinp{width:52px!important;text-align:center;font-weight:800;font-size:.86rem;padding:.26rem .08rem!important;border-radius:7px!important}
.pr-badge{font-size:.58rem;background:rgba(255,215,0,.15);color:var(--gold);border-radius:4px;padding:.08rem .3rem;font-weight:700;white-space:nowrap}
.bw-tag{font-size:.62rem;color:var(--ice);background:rgba(72,202,228,.1);border-radius:5px;padding:.1rem .35rem;font-weight:700}
.del-set{width:22px;height:22px;border-radius:5px;border:none;background:rgba(255,107,107,.1);color:var(--red);cursor:pointer;font-size:.7rem;display:flex;align-items:center;justify-content:center;margin:0 auto}
.del-set:active{background:rgba(255,107,107,.25)}
.chk{width:28px;height:28px;border-radius:7px;border:2px solid var(--border);background:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:.85rem;transition:all .18s;color:transparent;margin:0 auto}
.chk.done{background:var(--green);border-color:var(--green);color:#000}

/* PREV DATA ROW */
.prev-row{font-size:.68rem;color:var(--t3);padding:.1rem 0;font-weight:600;font-variant-numeric:tabular-nums}
.prev-row.pr{color:var(--gold)}

/* DRAG HANDLE */
.drag-handle{cursor:grab;color:var(--t4);font-size:1rem;padding:.2rem;flex-shrink:0;touch-action:none}
.drag-handle:active{cursor:grabbing}

/* REST BAR */
.rest-bar{position:fixed;bottom:var(--nav);left:0;right:0;z-index:90;
  background:rgba(7,16,26,.98);backdrop-filter:blur(24px);
  border-top:1px solid rgba(72,202,228,.25);
  padding:.55rem .85rem;display:none;align-items:center;justify-content:space-between;
  gap:.7rem;box-shadow:0 -6px 24px rgba(72,202,228,.1)}
.rest-bar.on{display:flex}
.rest-ring{position:relative;width:44px;height:44px;flex-shrink:0}
.rest-ring svg{transform:rotate(-90deg)}
.ring-n{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:.82rem;font-weight:900;color:var(--ice);font-variant-numeric:tabular-nums}
.rest-t{font-size:1.35rem;font-weight:900;color:var(--ice);font-variant-numeric:tabular-nums;line-height:1}
.rest-lbl{font-size:.62rem;color:var(--t3);font-weight:700;text-transform:uppercase;letter-spacing:.4px}

/* MODAL */
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:200;
  display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(8px)}
.modal-ov.ctr{align-items:center;padding:.8rem}
.modal{background:var(--card);border:1px solid rgba(72,202,228,.1);border-radius:22px 22px 0 0;
  padding:1.1rem .85rem 1.5rem;width:100%;max-width:520px;max-height:92vh;overflow-y:scroll}
.modal.rd{border-radius:20px}
.modal::-webkit-scrollbar{display:none}
.m-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:0 auto .85rem}
.m-title{font-size:1.05rem;font-weight:900;color:var(--ice2);margin-bottom:.9rem;letter-spacing:.2px}
.form-g{margin-bottom:.75rem}
.form-g label{font-size:.68rem;color:var(--t3);font-weight:700;display:block;margin-bottom:.28rem;text-transform:uppercase;letter-spacing:.3px}

/* EXO PICKER */
.ep-item{display:flex;align-items:center;gap:.65rem;padding:.55rem .6rem;
  background:rgba(12,24,36,.8);border-radius:11px;cursor:pointer;
  border:1px solid transparent;margin-bottom:.35rem;transition:border-color .15s}
.ep-item:active{border-color:rgba(72,202,228,.3);background:rgba(72,202,228,.06)}
.ep-icon{width:46px;height:46px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:1.3rem;flex-shrink:0}
.ep-nm{font-weight:700;font-size:.85rem;line-height:1.25}
.ep-desc{font-size:.63rem;color:var(--t3);margin-top:.15rem;font-weight:600}

/* HISTORY */
.h-card{background:var(--card);border:1px solid var(--border);border-radius:14px;
  padding:.85rem .95rem;margin-bottom:.5rem;cursor:pointer;transition:all .18s;
  position:relative;padding-left:1.1rem}
.h-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
  background:linear-gradient(180deg,var(--ice),var(--blue2));border-radius:2px}
.h-card:active{opacity:.85}
.h-stats{display:flex;gap:.85rem;margin-top:.4rem;flex-wrap:wrap}
.h-v{font-weight:800;font-size:.88rem;font-variant-numeric:tabular-nums}
.h-l{font-size:.6rem;color:var(--t3);font-weight:700;display:block;margin-top:.04rem}

/* CALENDAR */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:.3rem;margin-bottom:.8rem}
.cal-day-lbl{text-align:center;font-size:.6rem;color:var(--t3);font-weight:700;text-transform:uppercase;padding:.2rem 0}
.cal-day{aspect-ratio:1;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  cursor:pointer;font-size:.72rem;font-weight:700;background:var(--card);border:1px solid var(--border);
  transition:all .18s;position:relative}
.cal-day.has-session{background:rgba(0,245,160,.12);border-color:rgba(0,245,160,.3);color:var(--green)}
.cal-day.today{border-color:rgba(72,202,228,.4);color:var(--ice)}
.cal-day.other-month{opacity:.3}
.cal-day:active{opacity:.7}
.cal-dot{width:5px;height:5px;border-radius:50%;background:var(--green);position:absolute;bottom:3px}
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:.6rem}
.cal-month{font-weight:800;font-size:.95rem;color:var(--ice2)}

/* CHART */
.chart-tabs{display:flex;gap:.25rem;margin-bottom:.7rem;background:rgba(12,24,36,.7);border-radius:11px;padding:.28rem}
.ct{flex:1;background:none;border:none;color:var(--t3);font-size:.7rem;font-weight:700;
  padding:.35rem;border-radius:8px;cursor:pointer;transition:all .18s;text-transform:uppercase;letter-spacing:.2px}
.ct.act{background:rgba(72,202,228,.14);color:var(--ice);border:1px solid rgba(72,202,228,.2)}
.chart-box{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:.8rem;margin-bottom:.6rem}
.chart-ttl{font-size:.66rem;color:var(--t3);font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-bottom:.55rem}

/* CHIPS */
.chip-scroll{display:flex;gap:.28rem;overflow-x:auto;padding-bottom:.3rem;margin-bottom:.6rem;-webkit-overflow-scrolling:touch}
.chip-scroll::-webkit-scrollbar{display:none}
.chip{padding:.3rem .7rem;border-radius:20px;font-size:.7rem;font-weight:700;border:1px solid var(--border);
  background:rgba(12,24,36,.8);color:var(--t3);cursor:pointer;white-space:nowrap;flex-shrink:0;transition:all .15s}
.chip.on{background:rgba(72,202,228,.14);border-color:rgba(72,202,228,.25);color:var(--ice)}

/* EMOJI */
.emoji-row{display:flex;flex-wrap:wrap;gap:.3rem;padding:.45rem;background:rgba(12,24,36,.7);border-radius:11px;margin-top:.4rem}
.em-btn{font-size:1.2rem;background:none;border:1px solid var(--border);border-radius:8px;padding:.28rem .32rem;cursor:pointer}
.em-btn:active{transform:scale(1.18)}

/* LIVE */
.live{display:inline-flex;align-items:center;gap:.3rem;font-size:.66rem;color:var(--green);font-weight:700;text-transform:uppercase;letter-spacing:.3px}
.ldot{width:5px;height:5px;border-radius:50%;background:var(--green);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}

/* COMPARE */
.cmp-row{display:flex;align-items:center;justify-content:space-between;padding:.4rem 0;border-bottom:1px solid rgba(255,255,255,.04);font-size:.82rem}
.up{color:var(--green)}.dn{color:var(--red)}.eq{color:var(--t3)}

/* EMPTY */
.empty{text-align:center;padding:2.5rem 1rem;color:var(--t3)}
.ei{font-size:2.4rem;margin-bottom:.5rem;opacity:.3}

/* ROUTINE SETS EDITOR */
.rse-block{background:var(--card2);border:1px solid var(--border);border-radius:12px;margin-bottom:.5rem;overflow:hidden}
.rse-head{display:flex;align-items:center;padding:.6rem .8rem;gap:.5rem;background:rgba(7,16,26,.4)}
.rse-body{padding:.4rem .7rem .7rem}
.rse-set{display:flex;align-items:center;gap:.35rem;margin-bottom:.3rem}
.rse-lbl{font-size:.68rem;color:var(--t3);font-weight:700;min-width:20px;text-align:center}
.rse-inp{width:54px!important;text-align:center;font-size:.82rem;font-weight:700;padding:.28rem .15rem!important;border-radius:7px!important}
.rse-unit{font-size:.65rem;color:var(--t3);font-weight:700}

hr{border:none;border-top:1px solid var(--border);margin:.7rem 0}
@keyframes slideUp{from{transform:translateY(12px);opacity:0}to{transform:translateY(0);opacity:1}}
.su{animation:slideUp .2s ease}
</style>
</head>
<body>
<div class="goku-bg"><svg viewBox="0 0 200 320" fill="none"><path d="M80 35 C75 20 65 10 60 18 C55 6 65 0 75 10 C70 2 80 0 82 12 C78 4 88 5 86 15 C84 8 92 10 90 20" fill="rgba(72,202,228,1)" opacity=".7"/><path d="M110 20 C115 8 125 5 128 15 C126 7 134 8 132 18 C130 10 138 15 135 22" fill="rgba(72,202,228,1)" opacity=".6"/><ellipse cx="100" cy="55" rx="24" ry="22" fill="rgba(72,202,228,.15)" stroke="rgba(72,202,228,.4)" stroke-width="1.5"/><rect x="91" y="74" width="18" height="12" rx="4" fill="rgba(72,202,228,.12)" stroke="rgba(72,202,228,.3)" stroke-width="1"/><path d="M68 86 C60 90 52 100 50 118 C48 136 54 148 62 154 L138 154 C146 148 152 136 150 118 C148 100 140 90 132 86 C124 82 116 80 100 80 C84 80 76 82 68 86Z" fill="rgba(72,202,228,.12)" stroke="rgba(72,202,228,.35)" stroke-width="1.5"/><path d="M52 90 C40 94 30 106 28 120 C26 132 32 142 40 146 C44 140 44 130 48 118 C52 108 58 98 68 90Z" fill="rgba(72,202,228,.1)" stroke="rgba(72,202,228,.3)" stroke-width="1.2"/><path d="M148 90 C160 94 170 106 172 120 C174 132 168 142 160 146 C156 140 156 130 152 118 C148 108 142 98 132 90Z" fill="rgba(72,202,228,.1)" stroke="rgba(72,202,228,.3)" stroke-width="1.2"/><rect x="22" y="142" width="22" height="18" rx="6" fill="rgba(72,202,228,.15)" stroke="rgba(72,202,228,.3)" stroke-width="1.2"/><rect x="156" y="142" width="22" height="18" rx="6" fill="rgba(72,202,228,.15)" stroke="rgba(72,202,228,.3)" stroke-width="1.2"/><rect x="62" y="150" width="76" height="8" rx="4" fill="rgba(72,202,228,.18)" stroke="rgba(72,202,228,.35)" stroke-width="1"/><path d="M62 158 C58 170 56 190 58 210 C60 226 66 238 72 244 L90 244 C92 230 92 210 90 190 C88 174 84 162 80 156Z" fill="rgba(72,202,228,.1)" stroke="rgba(72,202,228,.28)" stroke-width="1.2"/><path d="M138 158 C142 170 144 190 142 210 C140 226 134 238 128 244 L110 244 C108 230 108 210 110 190 C112 174 116 162 120 156Z" fill="rgba(72,202,228,.1)" stroke="rgba(72,202,228,.28)" stroke-width="1.2"/></svg></div>

<nav>
  <div class="logo">Road to Super Sayan 🔥</div>
  <div class="nav-tabs">
    <button class="ntb act" data-tab="workout"><div class="ico">🏋️</div>Séance</button>
    <button class="ntb" data-tab="routines"><div class="ico">📋</div>Routines</button>
    <button class="ntb" data-tab="history"><div class="ico">📊</div>Stats</button>
  </div>
</nav>

<div id="app">
<!-- WORKOUT -->
<div id="tab-workout" class="section act">
  <div id="v-home">
    <div class="inner">
      <div class="sec-head"><div class="sec-title">Bonne séance 💪</div></div>
      <div id="home-stats"></div>
      <div style="font-size:.68rem;color:var(--t3);font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-bottom:.5rem">Démarrer une routine</div>
      <div id="home-routines"></div>
      <button class="btn btn-ghost" style="width:100%;margin-top:.35rem" id="btn-free">+ Séance libre</button>
    </div>
  </div>
  <div id="v-active" style="display:none;display:flex;flex-direction:column;height:100%;overflow:hidden">
    <div class="topbar">
      <div>
        <div style="font-size:.6rem;color:var(--t3);font-weight:700;text-transform:uppercase;letter-spacing:.4px">Durée</div>
        <div class="timer-big" id="w-timer">00:00</div>
      </div>
      <div id="w-name" style="font-weight:800;font-size:.86rem;color:var(--t2);text-align:center;flex:1;padding:0 .4rem"></div>
      <div style="display:flex;align-items:center;gap:.4rem">
        <div class="live"><div class="ldot"></div>Live</div>
        <button class="btn btn-warning btn-sm" id="btn-pause">⏸</button>
        <button class="btn btn-danger btn-sm" id="btn-end">Fin ✓</button>
      </div>
    </div>
    <div style="flex:1;overflow-y:scroll;-webkit-overflow-scrolling:touch;overscroll-behavior:contain" id="active-scroll">
      <div class="inner" style="padding-top:.7rem">
        <div id="active-exos"></div>
        <button class="btn btn-ghost" style="width:100%;margin-top:.2rem" id="btn-add-exo">+ Exercice</button>
      </div>
    </div>
  </div>
</div>

<!-- ROUTINES -->
<div id="tab-routines" class="section">
  <div class="inner">
    <div class="sec-head">
      <div class="sec-title">Routines</div>
      <button class="btn btn-ice btn-sm" id="btn-new-routine">+ Nouvelle</button>
    </div>
    <div id="routines-list"></div>
  </div>
</div>

<!-- HISTORY -->
<div id="tab-history" class="section">
  <div class="inner">
    <div class="sec-head"><div class="sec-title">Statistiques</div></div>
    <!-- Calendar -->
    <div class="card" style="margin-bottom:.8rem">
      <div class="cal-nav">
        <button class="btn-icon" id="cal-prev">◀</button>
        <div class="cal-month" id="cal-title"></div>
        <button class="btn-icon" id="cal-next">▶</button>
      </div>
      <div class="cal-grid" id="cal-labels"></div>
      <div class="cal-grid" id="cal-days"></div>
    </div>
    <!-- Charts -->
    <div class="chart-tabs">
      <button class="ct act" data-p="week">Semaine</button>
      <button class="ct" data-p="month">Mois</button>
      <button class="ct" data-p="year">Année</button>
    </div>
    <div class="chart-box"><div class="chart-ttl">Volume (kg)</div><canvas id="c-vol" height="110"></canvas></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:.55rem;margin-bottom:.6rem">
      <div class="chart-box" style="margin:0"><div class="chart-ttl">Reps</div><canvas id="c-reps" height="90"></canvas></div>
      <div class="chart-box" style="margin:0"><div class="chart-ttl">Durée (min)</div><canvas id="c-dur" height="90"></canvas></div>
    </div>
    <div style="font-size:.68rem;color:var(--t3);font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-bottom:.5rem">Séances enregistrées</div>
    <div id="history-list"></div>
  </div>
</div>
</div>

<!-- REST BAR -->
<div class="rest-bar" id="rest-bar">
  <div style="display:flex;align-items:center;gap:.6rem">
    <div class="rest-ring">
      <svg width="44" height="44" viewBox="0 0 44 44">
        <circle cx="22" cy="22" r="18" stroke="rgba(72,202,228,.12)" stroke-width="4" fill="none"/>
        <circle id="r-arc" cx="22" cy="22" r="18" stroke="#48CAE4" stroke-width="4" fill="none" stroke-dasharray="113" stroke-dashoffset="0" stroke-linecap="round"/>
      </svg>
      <div class="ring-n" id="r-n">60</div>
    </div>
    <div><div class="rest-lbl">Récup</div><div class="rest-t" id="r-t">1:00</div></div>
  </div>
  <div style="display:flex;gap:.3rem">
    <button class="btn btn-xs btn-ghost" id="btn-rm15">−15s</button>
    <button class="btn btn-xs btn-ghost" id="btn-rp15">+15s</button>
    <button class="btn btn-xs btn-danger" id="btn-rskip">Skip →</button>
  </div>
</div>

<!-- MODALS -->
<div id="m-routine" class="modal-ov ctr" style="display:none">
  <div class="modal rd">
    <div class="m-title" id="rm-title">Nouvelle routine</div>
    <div class="form-g">
      <label>Nom</label>
      <div style="display:flex;gap:.4rem">
        <button class="btn btn-ghost btn-xs" style="flex-shrink:0" id="btn-emoji-toggle">😀</button>
        <input type="text" id="inp-rname" placeholder="💪 Push Day...">
      </div>
      <div id="emoji-panel" style="display:none"></div>
    </div>
    <div class="form-g">
      <label>Exercices</label>
      <div id="m-exo-list"></div>
      <button class="btn btn-ghost btn-sm" style="width:100%;margin-top:.4rem" id="btn-add-exo-r">+ Ajouter exercice</button>
    </div>
    <div style="display:flex;gap:.45rem;margin-top:.85rem">
      <button class="btn btn-ghost" style="flex:1" id="btn-cancel-r">Annuler</button>
      <button class="btn btn-ice" style="flex:2" id="btn-save-r">Sauvegarder</button>
    </div>
  </div>
</div>

<div id="m-exo" class="modal-ov" style="display:none">
  <div class="modal">
    <div class="m-handle"></div>
    <div class="m-title">Choisir un exercice</div>
    <div class="form-g"><input type="text" id="exo-search" placeholder="Rechercher..."></div>
    <div class="chip-scroll" id="muscle-chips"></div>
    <div id="exo-list" style="max-height:52vh;overflow-y:scroll"></div>
    <button class="btn btn-ghost" style="width:100%;margin-top:.65rem" id="btn-cancel-exo">Annuler</button>
  </div>
</div>

<div id="m-finish" class="modal-ov ctr" style="display:none">
  <div class="modal rd">
    <div class="m-title">🏆 Séance terminée !</div>
    <div id="fin-stats" class="stats-row s2"></div>
    <div class="form-g" style="margin-top:.5rem">
      <label>Note (optionnel)</label>
      <textarea id="inp-note" rows="2" style="resize:none;margin-top:.25rem" placeholder="Ressenti..."></textarea>
    </div>
    <div style="display:flex;flex-direction:column;gap:.4rem;margin-top:.7rem">
      <button class="btn btn-ice" style="width:100%" id="btn-save-wo">💾 Enregistrer</button>
      <button class="btn btn-danger" style="width:100%" id="btn-discard-wo">🗑️ Ne pas enregistrer</button>
    </div>
  </div>
</div>

<div id="m-detail" class="modal-ov" style="display:none">
  <div class="modal">
    <div class="m-handle"></div>
    <div class="m-title" id="det-title"></div>
    <div id="det-body"></div>
    <button class="btn btn-ghost" style="width:100%;margin-top:.7rem" id="btn-close-det">Fermer</button>
  </div>
</div>

</div>

// ── HELPERS ──
function fDur(ms){if(!ms||ms<0)return'0:00';const s=Math.floor(ms/1000),m=Math.floor(s/60),h=Math.floor(m/60);return h?`${h}h${String(m%60).padStart(2,'0')}m`:`${String(m).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;}
function fRest(s){return`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;}
function fDate(ts){return new Date(ts).toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'});}
function fKg(v){return v>=1000?(v/1000).toFixed(1)+'t':Math.round(v)+'kg';}
function calcVol(w){return(w.exercises||[]).reduce((a,ex)=>a+ex.sets.filter(s=>s.done).reduce((b,s)=>b+(ex.bw?0:(s.weight||0)*(s.reps||0)),0),0);}
function calcReps(w){return(w.exercises||[]).reduce((a,ex)=>a+ex.sets.filter(s=>s.done).reduce((b,s)=>b+(s.reps||0),0),0);}
function calcSets(w){return(w.exercises||[]).reduce((a,ex)=>a+ex.sets.filter(s=>s.done).length,0);}
function estDur(r){
  // estimate routine duration: 37s per set + rest time
  let secs=0;
  (r.exercises||[]).forEach(ex=>{
    const ns=ex.sets?ex.sets.length:(ex.dSets||3);
    const rest=ex.restTime||60;
    secs+=ns*(37+rest)-rest; // last set no rest
  });
  return Math.round(secs/60);
}
function getPR(exoId,field){
  let best=0;
  S.sessions.forEach(s=>{
    (s.exercises||[]).filter(e=>e.id===exoId).forEach(ex=>{
      ex.sets.filter(s=>s.done).forEach(set=>{
        const v=field==='weight'?(set.weight||0):(set.reps||0);
        if(v>best)best=v;
      });
    });
  });
  return best;
}
function getLastSession(exoId){
  for(let i=S.sessions.length-1;i>=0;i--){
    const ex=(S.sessions[i].exercises||[]).find(e=>e.id===exoId);
    if(ex&&ex.sets&&ex.sets.some(s=>s.done))return{session:S.sessions[i],ex};
  }
  return null;
}
function getLastRoutineSession(routineName){
  for(let i=S.sessions.length-1;i>=0;i--){
    if(S.sessions[i].name===routineName)return S.sessions[i];
  }
  return null;
}

    hr.innerHTML=`<div style="background:var(--card);border:1px dashed var(--border);border-radius:14px;padding:1.1rem;text-align:center;color:var(--t3);font-size:.84rem;font-weight:600;margin-bottom:.4rem">Crée une routine dans l'onglet Routines 💡</div>`;

// ── START WORKOUT ──
function startRoutine(i){
  const r=S.routines[i];
  const prev=getLastRoutineSession(r.name);
  S.cw={
    name:r.name,rIdx:i,start:Date.now(),notes:'',pausedMs:0,
    exercises:r.exercises.map(ex=>{
      // Use saved sets from routine definition
      const sets=(ex.sets||Array.from({length:ex.dSets||3},()=>({weight:ex.dW||0,reps:ex.dReps||10}))).map(s=>({weight:s.weight||0,reps:s.reps||10,done:false}));
      return{...ex,sets,_prev:prev?(prev.exercises||[]).find(e=>e.id===ex.id)||null:null};
    })
  };
  save();startWTimer();showActive();
}
function startFree(){
  S.cw={name:'Séance libre',rIdx:null,start:Date.now(),notes:'',pausedMs:0,exercises:[]};
  save();startWTimer();showActive();
}
function showActive(){
  ge('v-home').style.display='none';
  ge('v-active').style.display='flex';
  ge('v-active').style.flexDirection='column';
  ge('v-active').style.height='100%';
  ge('v-active').style.overflow='hidden';
  ge('w-name').textContent=S.cw.name;
  wPaused=false;ge('btn-pause').textContent='⏸';
  renderActive();
}
function startWTimer(){
  wStart=S.cw.start;wPausedTotal=S.cw.pausedMs||0;wPaused=false;
  clearInterval(wInt);
  wInt=setInterval(()=>{
    if(wPaused)return;
    const el=ge('w-timer');
    if(el)el.textContent=fDur(Date.now()-wStart-wPausedTotal);
  },500);
}

// ── ACTIVE WORKOUT ──
function renderActive(){
  const c=ge('active-exos');c.innerHTML='';
  S.cw.exercises.forEach((ex,ei)=>c.appendChild(buildExoBlock(ex,ei)));
}

function buildExoBlock(ex,ei){
  const def=exoDef(ex.id);
  const div=document.createElement('div');
  div.className='exo-block su';
  div.draggable=true;
  div.dataset.ei=ei;

  // Get PR for this exercise
  const prW=getPR(ex.id,'weight');

  // Build header
  const head=document.createElement('div');
  head.className='exo-head';
  head.innerHTML=`
    <div class="drag-handle" title="Déplacer">⠿</div>
    <div class="exo-icon" style="background:${def.c}18;border:1px solid ${def.c}30">${def.ic}</div>
    <div style="flex:1;min-width:0">
      <div class="exo-nm">${def.n}</div>
      <div class="exo-sub">
        <span class="tag t-blue">${def.m}</span>
        <span class="tag ${ex.bw?'t-ice':'t-orange'}" style="margin-left:.2rem">${ex.bw?'Poids corps':def.e}</span>
        <span style="margin-left:.3rem;font-size:.65rem;color:var(--t3)">⏱ ${fRest(ex.restTime||60)}</span>
      </div>
    </div>

      <button class="btn-icon" style="font-size:.8rem" onclick="replaceExo(${ei})" title="Remplacer">🔄</button>
      <button class="btn-icon" onclick="rmExo(${ei})" title="Supprimer">✕</button>
    </div>`;
  div.appendChild(head);

  // Previous session data
  if(ex._prev&&ex._prev.sets&&ex._prev.sets.some(s=>s.done)){
    const prevDone=ex._prev.sets.filter(s=>s.done);
    const prevDiv=document.createElement('div');
    prevDiv.style.cssText='padding:0 .85rem .35rem;display:flex;flex-wrap:wrap;gap:.3rem';
    prevDiv.innerHTML=prevDone.map((s,i)=>{
      const isPR=!ex.bw&&prW>0&&(s.weight||0)>=prW&&prW>0;
      return`<span class="prev-row${isPR?' pr':''}">${isPR?'🥇 ':''}<b>${i+1}</b> ${ex.bw?'BW':((s.weight||0)+'kg')} × ${s.reps}rep${isPR?' 🏆':''}</span>`;
    }).join(' ');
    div.appendChild(prevDiv);
  }

  // Body - sets table
  const body=document.createElement('div');
  body.className='exo-body';
  body.id='body-'+ei;

  const tbl=document.createElement('table');
  tbl.className='stbl';
  tbl.innerHTML=`<thead><tr>
    <th>#</th>
    <th>${ex.bw?'BW':'kg'}</th>
    <th>Reps</th>
    <th>Vol</th>
    <th>✕</th>
    <th>✓</th>
  </tr></thead>
  <tbody id="sets-${ei}"></tbody>`;
  body.appendChild(tbl);

  const addBtn=document.createElement('button');
  addBtn.className='btn btn-ghost btn-xs';
  addBtn.style.marginTop='.45rem';
  addBtn.textContent='+ Série';
  addBtn.addEventListener('click',()=>addSet(ei));
  body.appendChild(addBtn);
  div.appendChild(body);

  // Drag events
  div.addEventListener('dragstart',e=>{dragSrc=ei;e.dataTransfer.effectAllowed='move';div.style.opacity='.5';});
  div.addEventListener('dragend',()=>{div.style.opacity='1';dragSrc=null;});
  div.addEventListener('dragover',e=>{e.preventDefault();e.dataTransfer.dropEffect='move';});
  div.addEventListener('drop',e=>{
    e.preventDefault();
    if(dragSrc===null||dragSrc===ei)return;
    const arr=S.cw.exercises;
    const tmp=arr.splice(dragSrc,1)[0];
    arr.splice(ei,0,tmp);
    save();renderActive();
  });

  renderSets(ei,prW);
  return div;
}

function renderSets(ei,prW){
  const ex=S.cw.exercises[ei];
  const tbody=ge('sets-'+ei);if(!tbody)return;
  if(prW===undefined)prW=getPR(ex.id,'weight');
  tbody.innerHTML='';
  ex.sets.forEach((s,si)=>{
    const v=ex.bw?'BW':((s.weight||0)*(s.reps||0)).toFixed(0)+'kg';
    const isPR=!ex.bw&&prW>0&&(s.weight||0)>0&&(s.weight||0)>=prW&&s.done;
    const tr=document.createElement('tr');
    tr.className=s.done?'set-done':'';
    tr.innerHTML=`
      <td><span class="s-num">${si+1}${isPR?' 🥇':''}</span></td>
      <td>${ex.bw?`<span class="bw-tag">BW</span>`:`<input type="number" class="sinp" value="${s.weight||''}" placeholder="0" min="0" step="0.5" onchange="updS(${ei},${si},'weight',this.value)">`}</td>
      <td><input type="number" class="sinp" value="${s.reps||''}" placeholder="10" min="1" onchange="updS(${ei},${si},'reps',this.value)"></td>
      <td style="font-size:.7rem;color:var(--t3);font-weight:700;font-variant-numeric:tabular-nums">${v}</td>
      <td><button class="del-set" onclick="delSet(${ei},${si})">✕</button></td>
      <td><button class="chk${s.done?' done':''}" onclick="togSet(${ei},${si})">${s.done?'✓':''}</button></td>`;
    tbody.appendChild(tr);
  });
}

function updS(ei,si,f,v){
  const ex=S.cw.exercises[ei];
  ex.sets[si][f]=f==='reps'?parseInt(v)||0:parseFloat(v)||0;
  save();renderSets(ei);
}
function delSet(ei,si){S.cw.exercises[ei].sets.splice(si,1);save();renderSets(ei);}
function addSet(ei){
  const ex=S.cw.exercises[ei];
  const l=ex.sets[ex.sets.length-1]||{weight:0,reps:10};
  ex.sets.push({weight:l.weight,reps:l.reps,done:false});
  save();renderSets(ei);
}
function togSet(ei,si){
  const ex=S.cw.exercises[ei];
  ex.sets[si].done=!ex.sets[si].done;
  save();renderSets(ei);
  if(ex.sets[si].done)startRest(ex.restTime||60);
}
function rmExo(ei){S.cw.exercises.splice(ei,1);save();renderActive();}
function replaceExo(ei){
  replaceCb=(newEx)=>{
    const old=S.cw.exercises[ei];
    S.cw.exercises[ei]={...newEx,restTime:old.restTime||60,sets:old.sets.map(s=>({...s})),_prev:getLastSession(newEx.id)?.ex||null};
    save();renderActive();
  };
  replaceFilter='Tous';
  ge('replace-search').value='';
  buildReplaceChips();
  filterReplaceExos();
  ge('m-replace-exo').style.display='flex';
}
function buildReplaceChips(){
  ge('replace-muscle-chips').innerHTML=MUSCLES.map(m=>`<div class="chip${m===replaceFilter?' on':''}" onclick="setRF('${m}',this)">${m}</div>`).join('');
}
function setRF(m,el){replaceFilter=m;document.querySelectorAll('#replace-muscle-chips .chip').forEach(c=>c.classList.remove('on'));el.classList.add('on');filterReplaceExos();}
function filterReplaceExos(){
  const q=ge('replace-search').value.toLowerCase();
  const list=EX.filter(e=>(replaceFilter==='Tous'||e.m===replaceFilter)&&(!q||e.n.toLowerCase().includes(q)));
  ge('replace-exo-list').innerHTML=list.map(e=>`<div class="ep-item" onclick="pickReplace('${e.id}')">
    <div class="ep-icon" style="background:${e.c}18;border:1px solid ${e.c}30">${e.ic}</div>
    <div style="flex:1;min-width:0"><div class="ep-nm">${e.n}</div>
    <div style="display:flex;gap:.25rem;margin:.15rem 0"><span class="tag t-blue">${e.m}</span><span class="tag ${e.bw?'t-ice':'t-orange'}">${e.bw?'Poids corps':e.e}</span></div>
    </div></div>`).join('');
}
function pickReplace(id){
  const e=EX.find(x=>x.id===id);if(!e||!replaceCb)return;
  ge('m-replace-exo').style.display='none';
  replaceCb({...e});replaceCb=null;
}

// ── PAUSE ──
function togglePause(){
  wPaused=!wPaused;
  const btn=ge('btn-pause');
  if(wPaused){wPausedAt=Date.now();btn.textContent='▶';ge('w-timer').classList.add('timer-paused');}
  else{wPausedTotal+=(Date.now()-wPausedAt);S.cw.pausedMs=wPausedTotal;save();btn.textContent='⏸';ge('w-timer').classList.remove('timer-paused');}
}

// ── REST ──
function startRest(s){
  clearInterval(rInt);rTotal=s;rLeft=s;
  ge('rest-bar').classList.add('on');
  updRest();
  rInt=setInterval(()=>{rLeft--;updRest();if(rLeft<=0){clearInterval(rInt);skipRest();}},1000);
}
function updRest(){
  ge('r-t').textContent=fRest(Math.max(0,rLeft));
  ge('r-n').textContent=Math.max(0,rLeft);
  const arc=ge('r-arc');
  if(arc)arc.style.strokeDashoffset=(113*(1-Math.max(0,rLeft)/rTotal)).toFixed(1);
}
function skipRest(){clearInterval(rInt);ge('rest-bar').classList.remove('on');}
function chRest(d){rLeft=Math.max(5,rLeft+d);if(rLeft>rTotal)rTotal=rLeft;updRest();}

// ── FINISH ──
function endWorkout(){
  if(wPaused)togglePause();
  clearInterval(wInt);
  const w=S.cw;
  w.duration=Date.now()-w.start-(w.pausedMs||0);
  w.volume=calcVol(w);w.totalSets=calcSets(w);w.totalReps=calcReps(w);
  ge('fin-stats').innerHTML=`
    <div class="stat-box"><div class="sv">${fDur(w.duration)}</div><div class="sl">Durée</div></div>
    <div class="stat-box"><div class="sv">${w.totalSets}</div><div class="sl">Séries</div></div>
    <div class="stat-box"><div class="sv">${fKg(w.volume)}</div><div class="sl">Volume</div></div>
    <div class="stat-box"><div class="sv">${w.totalReps}</div><div class="sl">Reps</div></div>`;
  ge('m-finish').style.display='flex';
}
function saveWO(){
  const w=S.cw;w.notes=ge('inp-note').value;w.savedAt=Date.now();
  S.sessions.push({...w});S.cw=null;save();
  ge('m-finish').style.display='none';skipRest();
  ge('v-active').style.display='none';ge('v-home').style.display='block';renderHome();
}
function discardWO(){
  if(!confirm('Abandonner sans enregistrer ?'))return;
  S.cw=null;clearInterval(wInt);save();skipRest();
  ge('m-finish').style.display='none';ge('v-active').style.display='none';ge('v-home').style.display='block';renderHome();
}

  if(!tmpExos.length){c.innerHTML='<div style="color:var(--t3);font-size:.8rem;font-weight:600;padding:.3rem 0">Aucun exercice</div>';return;}
  c.innerHTML='';
  tmpExos.forEach((ex,i)=>{
    const def=exoDef(ex.id);
    const sets=ex.sets||Array.from({length:ex.dSets||3},()=>({weight:ex.dW||0,reps:ex.dReps||10}));
    const restVal=ex.restTime||60;
    const restOpts=[30,45,60,75,90,105,120,135,150,180,210,240,300].map(v=>`<option value="${v}"${restVal===v?' selected':''}>${fRest(v)}</option>`).join('');

    const blk=document.createElement('div');
    blk.className='rse-block';

    // Header
    blk.innerHTML=`
      <div class="rse-head">
        <span class="drag-handle" style="cursor:grab">⠿</span>
        <span style="font-size:1.05rem">${def.ic}</span>
        <div style="flex:1;min-width:0;font-weight:700;font-size:.83rem;overflow:hidden;white-space:nowrap;text-overflow:ellipsis">${def.n}</div>
        <div style="display:flex;align-items:center;gap:.3rem;flex-shrink:0">
          <span style="font-size:.65rem;color:var(--t3);font-weight:700">Récup:</span>
          <select style="width:62px;padding:.22rem .25rem;font-size:.72rem;border-radius:7px" onchange="tmpExos[${i}].restTime=+this.value">${restOpts}</select>
          <button class="btn-icon" style="font-size:.85rem" onclick="tmpExos.splice(${i},1);renderMExos()">✕</button>
        </div>
      </div>
      <div class="rse-body" id="rse-sets-${i}"></div>
      <div style="padding:0 .7rem .55rem"><button class="btn btn-ghost btn-xs" onclick="addRSESet(${i})">+ Série</button></div>`;

    c.appendChild(blk);
    // Store sets ref
    tmpExos[i].sets=sets;
    renderRSESets(i);
  });
}

function renderRSESets(i){
  const ex=tmpExos[i];
  const cont=ge('rse-sets-'+i);if(!cont)return;
  const sets=ex.sets||[];
  cont.innerHTML='';
  sets.forEach((s,si)=>{
    const row=document.createElement('div');
    row.className='rse-set';
    row.innerHTML=`
      <span class="rse-lbl">${si+1}</span>
      ${ex.bw?'<span class="bw-tag">BW</span>':`<input type="number" class="rse-inp" value="${s.weight||''}" placeholder="kg" min="0" step="0.5" onchange="tmpExos[${i}].sets[${si}].weight=+this.value">`}
      <span class="rse-unit">×</span>
      <input type="number" class="rse-inp" value="${s.reps||''}" placeholder="reps" min="1" onchange="tmpExos[${i}].sets[${si}].reps=+this.value">
      <button class="del-set" onclick="tmpExos[${i}].sets.splice(${si},1);renderRSESets(${i})">✕</button>`;
    cont.appendChild(row);
  });
}
function addRSESet(i){
  const sets=tmpExos[i].sets||[];
  const l=sets[sets.length-1]||{weight:0,reps:10};
  sets.push({weight:l.weight,reps:l.reps});
  tmpExos[i].sets=sets;
  renderRSESets(i);
}
function addExoToRoutineModal(){
  openExoPicker(e=>{
    tmpExos.push({...e,restTime:60,sets:[{weight:0,reps:10},{weight:0,reps:10},{weight:0,reps:10}]});
    renderMExos();
  });
}
function saveRoutine(){
  const name=ge('inp-rname').value.trim();if(!name)return;
  const r={name,exercises:tmpExos.map(e=>({...e,dSets:e.sets?e.sets.length:3}))};
  if(rEditIdx!==null)S.routines[rEditIdx]=r;else S.routines.push(r);
  save();closeRModal();renderRoutines();
}

// ── EMOJI ──
function toggleEmoji(){
  const p=ge('emoji-panel');
  if(p.style.display==='none'){
    p.style.display='block';
    p.innerHTML=`<div class="emoji-row">${EMOJIS.map(e=>`<button class="em-btn" onclick="insEmoji('${e}')">${e}</button>`).join('')}</div>`;

function insEmoji(e){const i=ge('inp-rname');i.value=e+' '+i.value.trim();ge('emoji-panel').style.display='none';i.focus();}

// ── EXO PICKER ──
function openExoPicker(cb){
  exoCb=cb;mFilter='Tous';ge('exo-search').value='';
  ge('muscle-chips').innerHTML=MUSCLES.map(m=>`<div class="chip${m===mFilter?' on':''}" onclick="setMF('${m}',this)">${m}</div>`).join('');

}
function closeExoModal(){ge('m-exo').style.display='none';}
function setMF(m,el){mFilter=m;document.querySelectorAll('#muscle-chips .chip').forEach(c=>c.classList.remove('on'));el.classList.add('on');filterExos();}
function filterExos(){
  const q=ge('exo-search').value.toLowerCase();
  const list=EX.filter(e=>(mFilter==='Tous'||e.m===mFilter)&&(!q||e.n.toLowerCase().includes(q)||e.m.toLowerCase().includes(q)));
  ge('exo-list').innerHTML=list.map(e=>`<div class="ep-item" onclick="pickEx('${e.id}')">
    <div class="ep-icon" style="background:${e.c}18;border:1px solid ${e.c}30">${e.ic}</div>
    <div style="flex:1;min-width:0">
      <div class="ep-nm">${e.n}</div>
      <div style="display:flex;gap:.25rem;margin:.15rem 0;flex-wrap:wrap">
        <span class="tag t-blue">${e.m}</span>
        <span class="tag ${e.bw?'t-ice':'t-orange'}">${e.bw?'Poids corps':e.e}</span>
      </div>
      <div class="ep-desc">${e.d}</div>
    </div>
  </div>`).join('');
}
function pickEx(id){
  const e=EX.find(x=>x.id===id);if(!e||!exoCb)return;
  closeExoModal();exoCb({...e});exoCb=null;
}

// ── HISTORY ──
function renderHistory(){
  const c=ge('history-list');
  if(!S.sessions.length){c.innerHTML=`<div class="empty"><div class="ei">📊</div><p style="font-weight:700">Aucune séance</p></div>`;return;}
  c.innerHTML=[...S.sessions].reverse().map((s,ri)=>{
    const i=S.sessions.length-1-ri;
    const v=s.volume||calcVol(s),st=s.totalSets||calcSets(s),r=s.totalReps||calcReps(s);
    return`<div class="h-card" onclick="openDet(${i})">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:.28rem">
        <div style="font-weight:800;font-size:.93rem">${s.name}</div>
        <button class="btn btn-danger btn-xs" onclick="event.stopPropagation();delSession(${i})">🗑️</button>
      </div>
      <div style="font-size:.68rem;color:var(--t3);font-weight:600;margin-bottom:.38rem">${fDate(s.savedAt||s.start)}</div>
      <div class="h-stats">
        <div><span class="h-v">${fDur(s.duration||0)}</span><span class="h-l">Durée</span></div>
        <div><span class="h-v">${st}</span><span class="h-l">Séries</span></div>
        <div><span class="h-v">${fKg(v)}</span><span class="h-l">Volume</span></div>
        <div><span class="h-v">${r}</span><span class="h-l">Reps</span></div>
      </div>
    </div>`;
  }).join('');
}
function delSession(i){
  if(!confirm('Supprimer cette séance ?'))return;
  S.sessions.splice(i,1);save();renderHistory();renderCalendar();renderCharts();
}

// ── CALENDAR ──
function renderCalendar(){
  const now=new Date();
  const year=calDate.getFullYear(),month=calDate.getMonth();
  ge('cal-title').textContent=new Date(year,month,1).toLocaleDateString('fr-FR',{month:'long',year:'numeric'}).replace(/^\w/,c=>c.toUpperCase());
  // Labels Mon-Sun
  const lbls=['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
  ge('cal-labels').innerHTML=lbls.map(l=>`<div class="cal-day-lbl">${l}</div>`).join('');
  // Days
  const first=new Date(year,month,1);
  let startDow=first.getDay()-1;if(startDow<0)startDow=6;
  const daysInMonth=new Date(year,month+1,0).getDate();
  const daysInPrev=new Date(year,month,0).getDate();
  const cells=[];
  // Previous month days
  for(let i=startDow-1;i>=0;i--)cells.push({day:daysInPrev-i,cur:false,ts:new Date(year,month-1,daysInPrev-i).getTime()});
  // Current month
  for(let d=1;d<=daysInMonth;d++){
    const ts=new Date(year,month,d).getTime();
    cells.push({day:d,cur:true,ts});
  }
  // Next month
  const rem=cells.length%7;if(rem>0){for(let i=1;i<=7-rem;i++)cells.push({day:i,cur:false,ts:new Date(year,month+1,i).getTime()});}

  ge('cal-days').innerHTML=cells.map(cell=>{
    const dayStr=new Date(cell.ts).toDateString();
    const hasSession=S.sessions.some(s=>new Date(s.savedAt||s.start).toDateString()===dayStr);
    const manual=S.calManual&&S.calManual[dayStr];
    const active=hasSession||manual;
    const isToday=new Date(cell.ts).toDateString()===now.toDateString();
    return`<div class="cal-day${active?' has-session':''}${isToday?' today':''}${!cell.cur?' other-month':''}" onclick="calDayClick('${dayStr}',${cell.ts},${active},${cell.cur})">
      ${cell.day}
      ${active?'<div class="cal-dot"></div>':''}
    </div>`;
  }).join('');
}
function calDayClick(dayStr,ts,hasActive,isCurrent){
  // Check if there's a session for this day
  const daySessions=S.sessions.filter(s=>new Date(s.savedAt||s.start).toDateString()===dayStr);
  if(daySessions.length>0){
    // Show session detail
    const idx=S.sessions.indexOf(daySessions[daySessions.length-1]);
    openDet(idx);return;
  }
  // Toggle manual
  if(!S.calManual)S.calManual={};
  if(S.calManual[dayStr])delete S.calManual[dayStr];
  else S.calManual[dayStr]=true;
  save();renderCalendar();
}

// ── DETAIL ──
function openDet(i){
  const s=S.sessions[i];
  ge('det-title').textContent=s.name+' — '+fDate(s.savedAt||s.start);
  let prev=null;
  for(let j=i-1;j>=0;j--){if(S.sessions[j].name===s.name){prev=S.sessions[j];break;}}
  const sv=s.volume||calcVol(s),ss=s.totalSets||calcSets(s),sr=s.totalReps||calcReps(s);
  let h=`<div class="stats-row s3" style="margin-bottom:.8rem">
    <div class="stat-box"><div class="sv">${fDur(s.duration||0)}</div><div class="sl">Durée</div></div>
    <div class="stat-box"><div class="sv">${ss}</div><div class="sl">Séries</div></div>
    <div class="stat-box"><div class="sv">${fKg(sv)}</div><div class="sl">Volume</div></div>
  </div>`;
  if(prev){
    const dv=sv-(prev.volume||0),ds=ss-(prev.totalSets||calcSets(prev));
    h+=`<div style="font-size:.66rem;color:var(--t3);font-weight:700;text-transform:uppercase;letter-spacing:.3px;margin-bottom:.4rem">vs précédente</div>
    <div class="card" style="margin-bottom:.75rem">
      <div class="cmp-row"><span>Volume</span><span class="${dv>0?'up':dv<0?'dn':'eq'}">${dv>0?'+':''}${fKg(Math.abs(dv))} ${dv>0?'▲':dv<0?'▼':'='}</span></div>
      <div class="cmp-row" style="border:none"><span>Séries</span><span class="${ds>0?'up':ds<0?'dn':'eq'}">${ds>0?'+':''}${ds} ${ds>0?'▲':ds<0?'▼':'='}</span></div>
    </div>`;
  }
  h+=`<div style="font-size:.66rem;color:var(--t3);font-weight:700;text-transform:uppercase;letter-spacing:.3px;margin-bottom:.4rem">Exercices</div>`;
  s.exercises.forEach(ex=>{
    const d=ex.sets.filter(s=>s.done);if(!d.length)return;
    const def=exoDef(ex.id);
    const prW=getPR(ex.id,'weight');
    h+=`<div style="background:rgba(12,24,36,.8);border-radius:11px;padding:.65rem .8rem;margin-bottom:.4rem;border:1px solid var(--border)">
      <div style="font-weight:800;font-size:.87rem;margin-bottom:.32rem">${def.ic} ${def.n}</div>
      ${d.map((s,i)=>{
        const isPR=!ex.bw&&prW>0&&(s.weight||0)>=prW&&(s.weight||0)>0;
        return`<div style="font-size:.79rem;color:var(--t2);display:flex;gap:.9rem;padding:.16rem 0;font-weight:600;align-items:center">
          <span style="color:var(--t3);min-width:16px;font-weight:800">${i+1}</span>
          ${!ex.bw?`<span style="color:${isPR?'var(--gold)':'var(--ice)'};font-weight:800">${s.weight||0}kg${isPR?' 🥇':''}</span>`:'<span class="bw-tag">BW</span>'}
          <span>${s.reps||0} reps</span>
          ${!ex.bw?`<span style="color:var(--t3)">${((s.reps||0)*(s.weight||0)).toFixed(0)}kg vol</span>`:''}
        </div>`;
      }).join('')}
    </div>`;
  });
  if(s.notes)h+=`<div style="background:rgba(12,24,36,.8);border-radius:11px;padding:.6rem .8rem;font-size:.82rem;color:var(--t2);border:1px solid var(--border);font-weight:600;margin-top:.3rem">💬 ${s.notes}</div>`;
  ge('det-body').innerHTML=h;ge('m-detail').style.display='flex';
}
function closeDet(){ge('m-detail').style.display='none';}

// ── CHARTS ──
function getCD(p){
  const now=new Date();let labels=[],vd=[],rd=[],dd=[];
  if(p==='week'){
    for(let i=6;i>=0;i--){const d=new Date(now);d.setDate(d.getDate()-i);labels.push(d.toLocaleDateString('fr-FR',{weekday:'short'}));
      const ss=S.sessions.filter(s=>new Date(s.savedAt||s.start).toDateString()===d.toDateString());
      vd.push(ss.reduce((a,s)=>a+(s.volume||calcVol(s)),0));
      rd.push(ss.reduce((a,s)=>a+(s.totalReps||calcReps(s)),0));
      dd.push(ss.reduce((a,s)=>a+Math.round((s.duration||0)/60000),0));}
  } else if(p==='month'){
    for(let i=4;i>=0;i--){const d=new Date(now);d.setDate(d.getDate()-i*7);const ws=new Date(d);ws.setDate(ws.getDate()-6);
      labels.push('S-'+i);
      const ss=S.sessions.filter(s=>{const t=new Date(s.savedAt||s.start);return t>=ws&&t<=d;});
      vd.push(ss.reduce((a,s)=>a+(s.volume||calcVol(s)),0));
      rd.push(ss.reduce((a,s)=>a+(s.totalReps||calcReps(s)),0));
      dd.push(ss.reduce((a,s)=>a+Math.round((s.duration||0)/60000),0));}
  } else {
    for(let i=11;i>=0;i--){const d=new Date(now);d.setMonth(d.getMonth()-i);
      labels.push(d.toLocaleDateString('fr-FR',{month:'short'}));
      const ss=S.sessions.filter(s=>{const t=new Date(s.savedAt||s.start);return t.getMonth()===d.getMonth()&&t.getFullYear()===d.getFullYear();});
      vd.push(ss.reduce((a,s)=>a+(s.volume||calcVol(s)),0));
      rd.push(ss.reduce((a,s)=>a+(s.totalReps||calcReps(s)),0));
      dd.push(ss.reduce((a,s)=>a+Math.round((s.duration||0)/60000),0));}
  }
  return{labels,vd,rd,dd};
}
const cOpts={responsive:true,maintainAspectRatio:true,plugins:{legend:{display:false}},scales:{x:{grid:{color:'rgba(255,255,255,.04)'},ticks:{color:'#4A7FA5',font:{size:9,family:'Nunito',weight:'700'}}},y:{grid:{color:'rgba(255,255,255,.04)'},ticks:{color:'#4A7FA5',font:{size:9,family:'Nunito',weight:'700'}},beginAtZero:true}}};
function mkChart(id,data,color,type='bar'){
  const cv=ge(id);if(!cv)return;if(charts[id])charts[id].destroy();
  charts[id]=new Chart(cv,{type,data:{labels:data.labels,datasets:[{data:data.d,backgroundColor:color+'28',borderColor:color,borderWidth:2,borderRadius:5,fill:type==='line',tension:.4,pointBackgroundColor:color,pointRadius:2}]},options:cOpts});
}
function renderCharts(){
  const d=getCD(chartP);
  mkChart('c-vol',{labels:d.labels,d:d.vd},'#48CAE4');
  mkChart('c-reps',{labels:d.labels,d:d.rd},'#00F5A0','line');
  mkChart('c-dur',{labels:d.labels,d:d.dd},'#FFB347','line');
}
